<link rel="stylesheet" href="styles.css">

<style>
    body {
        margin: 0;
        text-align: center;
        background: #fff8ec;
        color: #a5332d;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
    }

    h1, h2 {
        color: #2b1a10;
        text-align: center;
    }

    ul, li {
        list-style: none !important;
        margin: 0 !important;
        padding: 0 !important;
        text-align: center;
    }

    nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: #C91E1E;
    }

    nav img {
        height: 48px;
        width: auto;
        display: block;
        border-radius: 6px;
    }

    nav a:hover img,
    nav a:focus img {
        outline: 3px solid #ffffff;
    }

    /* poster and gallery image share the same height */
    .hero img,
    .gallery img {
        display: block;
        margin: 0 auto;
        height: 250px;
        width: auto;
        max-width: 100%;
    }

    .hero img {
        margin-top: 1rem;
        margin-bottom: 1rem;
    }

    p {
        max-width: 800px;
        margin: 1rem auto;
        padding: 0 1rem;
        text-align: center;
    }

    .gallery {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    /* accessible link: underlined, high contrast, clear focus outline */
    .video-link a {
        color: #8a2b00;
        font-weight: bold;
        text-decoration: underline;
    }

    .video-link a:hover {
        color: #5c1d00;
    }

    .video-link a:focus {
        outline: 3px solid #1a0d08;
        outline-offset: 3px;
    }

    footer {
        padding: 1.5rem 1rem;
        font-size: 0.9rem;
        text-align: center;
    }
</style>
</head>
